tools:
  - name: pdf_info
    description: >-
      Return a JSON summary of one PDF document: page count, metadata, and
      encryption state. Runs headlessly through pdfcraft-cli.
    input_schema:
      type: object
      properties:
        path:
          type: string
          description: Path to the PDF file to inspect.
      required: [path]
      additionalProperties: false
    output_schema: {type: object}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: any
    timeout_hint_secs: 60
    source_file: scripts/pdf_info.py
  - name: list_pdfcraft_tools
    description: >-
      List the tool table the installed PdfCraft publishes, with JSON Schemas.
      Call this instead of assuming a tool exists: the table is read from the
      host at call time and grows between upstream releases.
    input_schema:
      type: object
      properties: {}
      additionalProperties: false
    output_schema: {type: object}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: any
    timeout_hint_secs: 60
    source_file: scripts/list_pdfcraft_tools.py
  - name: list_pdfcraft_commands
    description: List the engine command table the installed PdfCraft publishes.
    input_schema:
      type: object
      properties: {}
      additionalProperties: false
    output_schema: {type: object}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: any
    timeout_hint_secs: 60
    source_file: scripts/list_pdfcraft_commands.py
  - name: ui_screenshot
    description: >-
      Capture the running PdfCraft window. Requires the desktop app started with
      `--control <file>`; fails with guidance when no instance is attached.
    input_schema:
      type: object
      properties: {}
      additionalProperties: true
    output_schema: {type: object}
    read_only: true
    destructive: false
    idempotent: false
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/ui_screenshot.py
  - name: ui_inspect
    description: >-
      Inspect the running PdfCraft UI tree. Requires the desktop app started with
      `--control <file>`.
    input_schema:
      type: object
      properties: {}
      additionalProperties: true
    output_schema: {type: object}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/ui_inspect.py
  - name: execute_pdfcraft_batch
    description: >-
      Run a reviewed document workflow in one headless native PdfCraft session.
      Requires a configured PDFCRAFT_ROOT. Only doc_create, doc_open, doc_close,
      doc_save, doc_info, doc_set_info, page_add_image, page_add_text, page_render,
      edit_undo and edit_redo are permitted. Each args object is validated against
      the live host schema before execution. Saves require new .pdf paths and
      renders require top-level out with new .png paths. Existing files are never
      overwritten. A failed call must be inspected before retrying.
    input_schema:
      type: object
      properties:
        steps:
          type: array
          minItems: 1
          maxItems: 64
          items:
            type: object
            properties:
              tool:
                type: string
                enum: [doc_create, doc_open, doc_close, doc_save, doc_info, doc_set_info, page_add_image, page_add_text, page_render, edit_undo, edit_redo]
              args: {type: object}
              out: {type: string, minLength: 1}
            required: [tool, args]
            additionalProperties: false
      required: [steps]
      additionalProperties: false
    output_schema: {type: object}
    read_only: false
    destructive: false
    idempotent: false
    execution: sync
    affinity: any
    timeout_hint_secs: 180
    source_file: scripts/execute_pdfcraft_batch.py
