name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "release-please--branches--**"]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DCC_MCP_DISABLE_DEFAULT_SKILL_PATHS: "1"
  DCC_MCP_DISABLE_ACCUMULATED_SKILLS: "1"
  DCC_MCP_DISABLE_FILE_LOGGING: "1"
  DCC_MCP_DISABLE_JOB_PERSISTENCE: "1"
  DCC_MCP_DISABLE_TELEMETRY: "1"
  DCC_MCP_CHECKPOINT_IN_MEMORY: "1"

jobs:
  minimum-core:
    name: Minimum Core 0.20.44 / Python 3.9
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
      - run: python -m pip install -e ".[dev]" "dcc-mcp-core==0.20.44"
      - run: python -m pytest

  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.11", "3.12"]
        exclude:
          - os: windows-latest
            python-version: "3.9"
          - os: macos-latest
            python-version: "3.9"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest

  lint-build:
    name: Lint and package build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      # Validate a real Install SOP report, not a fixture: the report is built
      # from a live doctor run and pushed through Core's schema validator. A
      # schema that ships but never executes is how a wrong value reached a
      # release in the incident this gate exists to prevent.
      - name: Validate a real Install SOP report
        run: python -c "from dcc_mcp_pdfcraft.install_report import validated_report; validated_report(); print('install SOP report is valid')"
      - run: python -m pip install "hatchling==1.32.0" build twine
      - run: python -m build --no-isolation
      - run: python -m twine check dist/*

  native-paired-workflow:
    name: Native FilmCraft to PdfCraft MCP workflow
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: dcc-mcp/dcc-mcp-filmcraft
          ref: b2109ba45833438aadea935401e536dc6f74bc0e
          path: filmcraft-proof
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install adapters and independent media/PDF validators
        run: python -m pip install -e ".[dev]" -e ./filmcraft-proof pillow pypdf
      - name: Install native media validators
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg poppler-utils
      - name: Fetch checksum-verified official PdfCraft CLI
        run: python scripts/fetch_acceptance_runtime.py
      - name: Fetch checksum-verified official FilmCraft CLI
        working-directory: filmcraft-proof
        run: python scripts/fetch-native-runtime.py
      - name: Edit and export with real native FilmCraft through MCP
        run: >-
          python filmcraft-proof/tests/mcp-e2e.py
          --mode native
          --native-cli filmcraft-proof/runtime/filmcraft-cli
          --output evidence/filmcraft
      - name: Create and independently verify PdfCraft storyboard through MCP
        run: >-
          python scripts/native_storyboard_acceptance.py
          --media evidence/filmcraft/export.mp4
          --output evidence/pdfcraft
          --pdfcraft-cli runtime/pdfcraft-cli-0.13.0-linux-x86_64/pdfcraft-cli
          --filmcraft-head b2109ba45833438aadea935401e536dc6f74bc0e
      - name: Verify PhotoCraft and FilmCraft image assets through native PdfCraft
        run: >-
          python scripts/native_asset_handoff_acceptance.py
          --media evidence/filmcraft/export.mp4
          --output evidence/asset-handoff
          --pdfcraft-cli runtime/pdfcraft-cli-0.13.0-linux-x86_64/pdfcraft-cli
          --expected-cli-sha256 2283260fc06a2cadc32c2836fcdd29ed2996418ab3c03291e01a3d20328d157e
          --filmcraft-head b2109ba45833438aadea935401e536dc6f74bc0e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-filmcraft-pdfcraft-evidence
          path: evidence/
          retention-days: 14
          if-no-files-found: warn
