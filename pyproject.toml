[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "dcc-mcp-pdfcraft"
version = "0.3.0"
description = "PdfCraft adapter for the DCC Model Context Protocol (MCP) ecosystem"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "loonghao", email = "hal.long@outlook.com" }]
keywords = ["pdfcraft", "pdf", "mcp", "dcc", "ai", "model-context-protocol"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics",
]
# Stay on the tested Core minor line; new minor APIs require adapter validation.
dependencies = ["dcc-mcp-core>=0.20.44,<0.21.0", "jsonschema>=4.18,<5"]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8", "ruff>=0.8", "twine>=6"]
# The optional stdio bridge reuses PdfCraft's own MCP server through the
# official SDK. The SDK requires Python 3.10+, so declaring it as a
# version-gated extra keeps the default install usable on 3.9.
mcp = ["mcp>=1.30,<2; python_version >= '3.10'"]

[project.urls]
Homepage = "https://github.com/dcc-mcp/dcc-mcp-pdfcraft"
Repository = "https://github.com/dcc-mcp/dcc-mcp-pdfcraft"
Issues = "https://github.com/dcc-mcp/dcc-mcp-pdfcraft/issues"

[project.scripts]
dcc-mcp-pdfcraft = "dcc_mcp_pdfcraft.cli:main"
dcc-mcp-pdfcraft-install = "dcc_mcp_pdfcraft.install:main"

[project.entry-points."dcc_mcp.adapters"]
pdfcraft = "dcc_mcp_pdfcraft:PdfCraftMcpServer"

[tool.hatch.build.targets.wheel]
packages = ["src/dcc_mcp_pdfcraft"]
artifacts = ["src/dcc_mcp_pdfcraft/skills/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
